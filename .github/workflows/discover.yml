name: Discover new CSS feature candidates

on:
  schedule:
    # 08:00 UTC daily
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node scripts/discover.mjs

      - name: Commit updated pending queue
        run: |
          git config user.name "css-features-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pending.json data/seen-urls.json
          git diff --cached --quiet || git commit -m "chore: discover new CSS feature candidates"
          git push
