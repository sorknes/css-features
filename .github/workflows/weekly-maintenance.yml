name: Weekly CSS feature maintenance

on:
  schedule:
    # ~08:00 Europe/Oslo every Monday. GitHub Actions cron is UTC-only and has no
    # timezone/DST support, so this is approximated with two schedules that switch
    # with daylight saving — only one fires on any given Monday, based on month.
    # Minute is offset to :17 rather than :00 — GitHub's docs warn that the top of
    # every hour is the most congested time for scheduled runs and can be delayed
    # or dropped under load (observed directly: one run fired 6h20m late, another
    # didn't fire at all the same week, both scheduled at the exact hour mark).
    - cron: "17 6 * 4-10 1"      # Apr–Oct ≈ CEST (UTC+2) → ~08:17 Oslo
    - cron: "17 7 * 1-3,11,12 1" # Nov–Mar ≈ CET  (UTC+1) → ~08:17 Oslo
    # This is off by an hour for the handful of days right around the actual DST
    # transition (last Sunday of March / October), since it switches on calendar
    # month rather than the exact transition date — not worth the added complexity
    # for a weekly, non-time-critical job.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Updates caniuse-lite's bundled dataset (and package.json/package-lock.json)
      # so the refresh step below can pick up newly-shipped browser versions.
      - name: Update caniuse-lite data
        run: npx update-browserslist-db@latest

      - name: Discover new candidate articles
        run: node scripts/discover.mjs

      - name: Refresh browser-support numbers on existing examples
        run: node scripts/refresh-browser-support.mjs

      - name: Lint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        id: build
        run: npm run build
        continue-on-error: true

      # GitHub Actions' own GITHUB_TOKEN is blocked from opening pull requests
      # unless a repo/org setting ("Allow GitHub Actions to create and approve
      # pull requests") is turned on — and PRs from this workflow should be
      # reviewed and opened by hand anyway, so this just pushes a branch and
      # stops. Re-pushes (force) to the same branch name each run, same as
      # the old create-or-update PR behavior, so nothing accumulates.
      - name: Commit and push changes
        run: |
          if git diff --quiet -- data/ package.json package-lock.json; then
            echo "No changes to commit — nothing to push." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          DIFF_STAT=$(git diff --stat -- data/ package.json package-lock.json)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B automated/weekly-maintenance
          git add data/pending.json data/seen-urls.json data/examples.json package.json package-lock.json
          git commit -m "chore: weekly CSS feature maintenance"
          git push --force origin automated/weekly-maintenance

          {
            echo "## Weekly CSS feature maintenance"
            echo ""
            echo "Branch \`automated/weekly-maintenance\` pushed — [open a PR manually](https://github.com/${{ github.repository }}/compare/main...automated/weekly-maintenance?expand=1) to review and merge."
            echo ""
            echo "- Lint: ${{ steps.lint.outcome == 'success' && '✅ passed' || '❌ FAILED — check the workflow log before merging' }}"
            echo "- Build: ${{ steps.build.outcome == 'success' && '✅ passed' || '❌ FAILED — check the workflow log before merging' }}"
            echo ""
            echo "### Data changes"
            echo '```'
            echo "$DIFF_STAT"
            echo '```'
            echo ""
            echo "New candidates land in \`data/pending.json\` for a later manual/Claude Code pass — this doesn't turn them into gallery examples by itself."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run if lint or build broke
        if: steps.lint.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1
